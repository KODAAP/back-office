[flake8]
max-line-length = 130
exclude = .tox,.git,*/migrations/*,*env*,*venv*,__pycache__,*/staticfiles/*,*/mediafiles/*,node_modules,.envs,logs
ignore = E203,W503,F403,F405,F841,C901,F401
per-file-ignores =
    __init__.py:F401
    */settings/*.py:F403,F405
    core_apps/profiles/apps.py:F401
max-complexity = 10
select = B,C,E,F,W,T4,B9


;[coverage:run]
;source = .
;omit=
;    *apps.py,
;    *settings.py,
;    *urls.py,
;    *wsgi.py,
;    *asgi.py,
;    manage.py,
;    conftest.py,
;    *base.py,
;    *local.py,
;    *production.py,
;    *__init__.py,
;    */migrations/*,
;    *tests/*,
;    */env/*,
;    */venv/*,
;
;[coverage:report]
;show_missing = True
