name: CI — Backend (Django)

on:
  push:
    branches: [ main, develop ]   # CI sur les deux branches
  pull_request:
    branches: [ main, develop ]   # CI sur les PRs vers develop ET main

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Lint & Format check
        run: |
          ruff check . --extend-exclude "*.md"
          ruff format --check . --extend-exclude "*.md"

  test:
    name: Tests Django
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_kodaap
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Utilise requirements/local.txt s'il existe, sinon requirements.txt
          if [ -f requirements/local.txt ]; then
            pip install -r requirements/local.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_kodaap
        run: python manage.py test --verbosity=2
